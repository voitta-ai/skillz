name: release

on:
  push:
    branches: [master]
  pull_request:
    # `next` is included so the per-plugin half of version-bumped still runs
    # there. The bundle half is exempted inside the job (see the base-ref
    # short-circuit below); the per-plugin half is the one that actually stops
    # a standalone install freezing on a stale copy, so it must not be lost
    # just because a PR targets the integration branch.
    branches: [master, next]
    # No paths-ignore here. version-bumped is a REQUIRED status check, and a
    # required check that never runs does not read as "skipped" to GitHub -
    # the PR sits on "Expected - waiting for status to be reported" and can
    # never merge. The job therefore always runs and decides internally
    # whether a bump is owed; see the maintainer-only short-circuit below.

permissions:
  contents: read

# This repo publishes ~32 per-skill plugins, each with its own version, plus
# the 'skillz' full-bundle plugin. The bundle version is the repo-level
# release anchor: one tag and one release per shipping merge, whose notes
# name the skills that changed. Per-plugin versions stay independent -- they
# are the cache key that makes THAT plugin re-extract, and they move at their
# own pace (secrets-in-agent-sessions is already at 2.0.0).
env:
  VERSION_FILE: plugins/skillz/.claude-plugin/plugin.json
  # Codex pins on its own manifest's version string exactly as Claude Code
  # does, so the two must move together or Codex installs freeze on a cached
  # copy. See skills/claude-code-codex-plugin-parity.
  CODEX_VERSION_FILE: plugins/skillz/.codex-plugin/plugin.json

jobs:
  # PR side. Nothing ships without a version bump: the version is the cache
  # key for ~/.claude/plugins/cache/<marketplace>/<plugin>/<version>/, so an
  # unchanged version means no install ever re-extracts and every user keeps
  # running the old build, with no error reported anywhere.
  version-bumped:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deep enough to resolve a merge-base against the PR base. A
          # --depth=1 checkout has no common ancestor, so the three-dot diff
          # below cannot resolve and every path looks changed.
          fetch-depth: 0

      - name: Version must advance
        id: gate
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE"

          # Maintainer-only paths ship nothing to an install, so they owe no
          # bump. This was paths-ignore on the trigger until the check became
          # required; it lives here now so the job still reports a status.
          #
          # hooks/ is this repo's own pre-push gate, enabled per clone with
          # `git config core.hooksPath hooks`. Nothing installs it: install.sh
          # does not copy it, no plugin manifest names it (plugins that ship
          # hooks carry their own under plugins/<name>/hooks/), and the
          # directory bundle builder copies only plugins/skillz. A hooks-only
          # change therefore ships nothing, and bumping the bundle for one
          # would publish a release whose content is identical to the last.
          changed=$(git diff --name-only FETCH_HEAD...HEAD)
          owed=1
          if [ -n "$changed" ]; then
            owed=0
            while IFS= read -r f; do
              case "$f" in
                .github/*|scripts/*|hooks/*) ;;
                *) owed=1; break ;;
              esac
            done <<<"$changed"
          fi
          # Deliberately not `grep -qv`: at least one grep in the wild
          # (ugrep, which some machines install as /usr/bin/grep) returns 1
          # from -qv on input whose FIRST line matches, which would flip this
          # to "no bump owed" for a PR that does ship a skill. `case` has no
          # such variance.
          if [ "$owed" -eq 0 ]; then
            echo "maintainer-only diff, no version bump owed:"
            sed 's/^/  /' <<<"$changed"
            echo "maintainer_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "maintainer_only=false" >> "$GITHUB_OUTPUT"

          # Integration-branch short-circuit. `next` is the long-lived branch
          # where experimental skills accumulate before a major release. The
          # bundle version is a MONOTONIC COUNTER SHARED BY EVERY SKILL PR, so
          # on a branch that batches many of them it is a lock, not a
          # safeguard: each PR would bump it, and every PR after the first is
          # stale by construction no matter how disjoint its subject matter.
          # See issue #188. So on `next` the bundle is exempt and stays put;
          # one real bump happens at merge-back to master, where the counter
          # means something because that is what ships.
          #
          # Per-skill plugins are NOT exempt. Their versions are independent
          # per-plugin cache keys, not a shared counter, so they never collide
          # and they still must advance - that is the check that keeps a
          # standalone install from freezing on a stale copy.
          if [ "$BASE" = "next" ]; then
            # Exempt is not the same as optional. If the counter may still be
            # bumped here it keeps advancing, and merge-back fights it again -
            # which is the whole thing the branch exists to avoid. So on `next`
            # the bundle version must be UNCHANGED, and that is enforced, not
            # merely unchecked. (Observed: a PR authored before this policy was
            # retargeted onto `next` carrying a bump, and nothing stopped it.)
            # The invariant is "next's bundle equals master's bundle", NOT
            # "unchanged since next". Comparing against next would freeze
            # whatever drift already leaked in and make correcting it
            # impossible; comparing against master is self-correcting, and it
            # still forbids the thing that matters - advancing the counter on
            # a branch that batches many PRs.
            git fetch --no-tags origin master
            old=$(git show "FETCH_HEAD:$VERSION_FILE" | jq -r .version)
            new=$(jq -r .version "$VERSION_FILE")
            if [ "$old" != "$new" ]; then
              echo "::error::base is 'next', so $VERSION_FILE#version must match master's $old (found $new)."
              echo "::error::The bundle counter is bumped once at merge-back to master, not per PR."
              exit 1
            fi
            codex=$(jq -r .version "$CODEX_VERSION_FILE")
            if [ "$codex" != "$new" ]; then
              echo "::error::$CODEX_VERSION_FILE is $codex, expected $new - the two manifests must match."
              exit 1
            fi
            echo "base is 'next': bundle pinned at $old (see issue #188);"
            echo "per-skill plugin versions still enforced below."
            echo "exempt_bundle=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exempt_bundle=false" >> "$GITHUB_OUTPUT"

          old=$(git show "FETCH_HEAD:$VERSION_FILE" | jq -r .version)
          new=$(jq -r .version "$VERSION_FILE")
          if [ "$old" = "$new" ]; then
            echo "::error::$VERSION_FILE#version is still $old - bump it."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | head -1)" != "$old" ]; then
            echo "::error::$new does not advance past $old."
            exit 1
          fi
          codex=$(jq -r .version "$CODEX_VERSION_FILE")
          if [ "$codex" != "$new" ]; then
            echo "::error::$CODEX_VERSION_FILE is $codex, expected $new - bump both manifests."
            exit 1
          fi
          echo "$old -> $new (claude + codex in sync)"

      # The check above only watches the bundle, which is the release anchor.
      # Every single-skill plugin has its own version and its own install
      # cache keyed on it, so editing skills/foo/ and bumping only the bundle
      # leaves standalone `foo` installs frozen while `plugin update` reports
      # "up to date". This maps the diff back to the plugins that ship it.
      #
      # Guarded on the same short-circuit: a maintainer-only diff ships no
      # plugin, so there is nothing to map.
      - name: Every touched plugin must bump too
        if: steps.gate.outputs.maintainer_only != 'true'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          args=""
          if [ "${{ steps.gate.outputs.exempt_bundle }}" = "true" ]; then
            args="--exempt skillz"
          fi
          # Diff against the PR's own base, not FETCH_HEAD: the next-branch
          # path above re-fetches master, which would otherwise move FETCH_HEAD
          # out from under this step and diff a next PR against master.
          git fetch --no-tags origin "$BASE"
          python3 scripts/check-plugin-version-bumps.py $args FETCH_HEAD

  # master side. The version is new by the time we get here, so cut the tag
  # and the release. Notes come from the merged PR titles since the previous
  # tag - that IS the changelog, which is why there is no CHANGELOG.md to
  # keep in sync. gh creates the tag itself at --target, so it lands on
  # master's squash commit rather than on a feature-branch commit that never
  # reaches master.
  tag-and-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and release if the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version "$VERSION_FILE")
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to release."
            exit 0
          fi
          gh release create "v$version" \
            --title "v$version" \
            --generate-notes \
            --target "$GITHUB_SHA"
